<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GitHub Extension</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <main>
      <header>
        <h1>GitHub Extension</h1>
        <p>Manage GitHub interface enhancements.</p>
      </header>

      <form id="settings-form">
        <details class="settings-foldout" open>
          <summary>
            <span>Notifications</span>
            <span class="summary-meta">GitHub status</span>
          </summary>
          <div class="foldout-body">
            <label class="preference">
              <input id="hide-inbox-while-busy" type="checkbox" />
              <span>
                <strong>Hide notifications while Busy</strong>
                <small>Hides GitHub's notifications inbox whenever your GitHub status is marked Busy.</small>
              </span>
            </label>
          </div>
        </details>

        <details class="settings-foldout" open>
          <summary>
            <span>Muted users</span>
            <span id="muted-users-summary" class="summary-meta">Not configured</span>
          </summary>
          <div class="foldout-body">
            <label class="preference">
              <input id="mute-users-enabled" type="checkbox" />
              <span>
                <strong>Mute selected users</strong>
                <small>Hides matching profiles, repositories, comments, avatars, and related GitHub content.</small>
              </span>
            </label>

            <label for="muted-users">GitHub usernames</label>
            <p class="help">Enter one username per line. The leading @ is optional. This list is stored in the browser and preserved across extension updates.</p>
            <textarea id="muted-users" rows="8" spellcheck="false"></textarea>
          </div>
        </details>

        <p id="status" role="status" aria-live="polite">Changes save automatically.</p>
      </form>
    </main>

    <script src="options.js"></script>
  </body>
</html>
